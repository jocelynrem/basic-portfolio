<!doctype html>
<html lang="en">
<head>
 <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
 <meta name="theme-color" content="#285d60">
 <meta name="description" content="Pull up a chair. Practice American Mahjong with three friendly computer players, a guided Charleston, and your 2026 card.">
 <title>The Mahjong Parlor · Pull up a chair</title>
 <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%2324594e'/%3E%3Ctext x='20' y='29' text-anchor='middle' fill='%23fff8e8' font-size='30'%3E✿%3C/text%3E%3C/svg%3E">
 <link rel="manifest" href="./manifest.webmanifest" crossorigin="use-credentials">
 <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png">
 <link rel="stylesheet" href="style.css?v=20261112-charleston">
 <link rel="stylesheet" href="../assets/portfolio-return.css">
</head>
<body>
 <header class="site-header">
  <a class="brand" href="./" aria-label="The Mahjong Parlor home"><span class="brand-flower">✽</span><span>the mahjong <i>parlor</i></span></a>
  <div class="header-actions">
   <button class="settings-button header-learn" data-action="learn" aria-label="Learn and hints"><span class="mobile-icon">?</span><span class="desktop-label">Learn</span></button>
   <button class="settings-button header-settings" data-action="settings" aria-label="Settings">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" focusable="false">
     <path d="M3 5h5m5 0h8M3 12h11m5 0h2M3 19h3m5 0h10"/>
     <circle cx="10.5" cy="5" r="2.5"/><circle cx="16.5" cy="12" r="2.5"/><circle cx="8.5" cy="19" r="2.5"/>
    </svg>
    <span class="desktop-label">Settings</span>
   </button>
   <button class="button outline header-new-game" data-action="new"><span>＋</span> New game</button>
  </div>

 </header>
 <main>
  <div class="workspace">
   <section class="play-area" aria-label="Mahjong game">
    <p class="charleston-info" id="charleston-info" hidden>
     <span data-charleston-step="1-0">Right</span> → <span data-charleston-step="1-1">Across</span> → <span data-charleston-step="1-2">Left</span>
     · Optional: <span data-charleston-step="2-0">Left</span> → <span data-charleston-step="2-1">Across</span> → <span data-charleston-step="2-2">Right</span>
     · <span data-charleston-step="courtesy">Courtesy: across, 0–3</span>
    </p>
    <button class="settings-button table-discards" id="table-discards" data-action="show-discards" aria-haspopup="dialog" hidden>Discards</button>
    <div class="table-stage"><div class="table" id="table">
     <div class="corner corner-tl">✧</div><div class="corner corner-tr">✧</div><div class="corner corner-bl">✧</div><div class="corner corner-br">✧</div>
     <div class="opponent-row"><div class="opponent west" id="seat3"></div><div class="opponent north" id="seat2"></div><div class="opponent east" id="seat1"></div></div>
     <div class="table-center" id="table-center"></div>
     <div class="player-zone"><div class="rack-area"><div id="your-exposures" class="your-exposures"></div><div class="rack-scroll"><div class="rack" id="rack" aria-label="Your tiles"></div></div><div class="rack-under"><div class="player-meta"><div><span class="you-avatar">Y</span><strong>You</strong><span class="seat-wind">EAST · DEALER</span></div><span id="rack-count"></span></div><span id="rack-arrange-help" class="sr-only">Drag to arrange. Double-click to discard.</span><div class="rack-tools"><button data-action="sort" class="table-text-button" title="Arrange tiles by suit">Sort</button><button id="arrange-toggle" data-action="arrange" class="table-text-button mobile-arrange" aria-pressed="false">Arrange</button></div></div></div><div class="action-bar"><div class="action-copy" aria-live="polite"><div class="phase-icon" id="phase-icon">↗</div><div><strong id="phase-title"></strong><p id="phase-description"></p></div></div><div class="action-buttons" id="actions"></div></div></div>
    </div>
    </div><section id="hand-focus" class="hand-focus" aria-label="Chosen hand and hand picker" aria-live="polite" hidden></section>
   <aside class="side-panel">
    <div id="hands-panel"></div>
   </aside>

   </section>

  </div>

 </main>
 <footer class="portfolio-footer">
  <a class="portfolio-return" href="../">Back to Jocelyn Remington’s portfolio</a>
 </footer>
 <div class="toast" id="toast" role="status" hidden></div>
 <dialog id="modal" aria-labelledby="modal-title"><div class="modal-top"><span class="eyebrow" id="modal-eyebrow"></span><button class="icon-button" data-action="close" aria-label="Close dialog">×</button></div><div id="modal-content"></div></dialog>
 <script type="module" src="js/app.mjs?v=20261112-charleston"></script>
</body>
</html>
