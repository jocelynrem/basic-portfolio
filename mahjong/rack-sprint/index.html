<!doctype html>
<html lang="en">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width, initial-scale=1">
 <meta name="theme-color" content="#393d3f">
 <meta name="description" content="Race through 10 Mahjong racks. Spot the closest card line, earn points for near misses, and review each hand.">
 <title>Rack Sprint · The Mahjong Parlor</title>
 <link rel="icon" href="../icons/flower.svg?v=teal-bloom-1" type="image/svg+xml">
 <link rel="stylesheet" href="../palette.css?v=suit-contrast-1">
 <link rel="stylesheet" href="./style.css?v=pale-controls-1">
 <script type="module" src="./game.mjs?v=teal-bloom-1"></script>
</head>
<body>
 <header class="masthead">
  <span class="wordmark"><svg class="brand-flower" viewBox="0 0 48 48" aria-hidden="true" focusable="false"><use href="../icons/flower.svg?v=teal-bloom-1#flower"/></svg> the mahjong <i>parlor</i></span>
  <a class="back-link" href="../"><span aria-hidden="true">←</span> Back to table</a>
 </header>
 <main>
  <section id="intro" class="intro" aria-labelledby="intro-heading">
   <div class="intro-copy">
    <h1 id="intro-heading" class="poster-title">Rack <em>Sprint</em></h1>
    <p>10 racks. Pick the line that needs the fewest tiles. Close picks earn points, too.</p>
    <div class="start-actions">
     <button type="button" id="start" class="primary-button">Start sprint <span aria-hidden="true">→</span></button>
     <label class="timer-toggle"><input type="checkbox" data-timer-toggle checked><span class="switch" aria-hidden="true"></span>20s timer</label>
    </div>
   </div>
   <div class="hero-art" aria-hidden="true">
    <div class="sun-disc"></div>
    <div class="speed-lines"></div>
    <div class="hero-spark spark-one">✦</div>
    <div class="hero-spark spark-two">✦</div>
    <div id="hero-tiles"></div>
   </div>
  </section>

  <section id="play" class="play" aria-labelledby="play-heading" hidden>
   <header class="game-heading">
    <h1 id="play-heading">Rack <em>Sprint</em></h1>
    <label class="timer-toggle"><input type="checkbox" data-timer-toggle checked><span class="switch" aria-hidden="true"></span>20s timer</label>
   </header>
   <div class="felt">
    <div class="round-strip">
     <div class="round-label">Rack <strong id="round-counter"></strong></div>
     <div id="progress" class="progress" aria-hidden="true"></div>
     <div class="score-label">Score <strong id="score">0</strong></div>
     <div id="timed-controls" class="timed-controls" hidden>
      <div id="clock" class="clock" role="timer" aria-label="Time remaining" hidden>
       <span class="clock-track" aria-hidden="true"></span><span id="time-left"></span>
      </div>
      <button type="button" id="pause-sprint" class="pause-button" aria-haspopup="dialog"><span aria-hidden="true"></span>Pause</button>
     </div>
    </div>
    <div class="rack-tray">
     <div id="rack" class="rack" role="group" aria-label="Your rack"></div>
    </div>
   </div>
   <div id="feedback" class="feedback" hidden>
    <div class="celebration" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <div id="feedback-title" role="group">
     <strong id="feedback-reaction"></strong>
     <span id="feedback-points" class="feedback-points"></span>
    </div>
   </div>
   <div id="answer-area" hidden>
    <div id="choices" class="choices" role="group" aria-label="Choose a card line"></div>
    <label class="names-toggle"><input type="checkbox" data-names-toggle> Show tile names</label>
   </div>
  </section>

  <section id="results" class="results" aria-labelledby="results-heading" hidden>
   <div class="scorecard">
    <div class="scorecard-content">
     <h1 id="results-heading">Sprint complete</h1>
     <p class="score-total"><strong id="final-score"></strong><span> / 1,000 pts</span></p>
     <p id="best-count"></p>
     <button type="button" id="again" class="primary-button">Play again <span aria-hidden="true">↻</span></button>
    </div>
    <div class="finish-art" aria-hidden="true"><div class="flag"></div><span>✦</span></div>
   </div>
   <div class="review-heading"><h2>Your racks</h2><p>100 points for the closest line. 25 fewer for each extra tile away.</p>
    <label class="names-toggle"><input type="checkbox" data-names-toggle> Show tile names</label>
   </div>
   <div id="review" class="review"></div>
  </section>
  <noscript><p>Rack Sprint needs JavaScript to deal the racks and score your choices.</p></noscript>
 </main>
 <dialog id="pause-dialog" class="pause-dialog" aria-labelledby="pause-heading">
  <h2 id="pause-heading">Sprint paused</h2>
  <button type="button" id="resume-sprint" class="primary-button" autofocus>Resume <span aria-hidden="true">→</span></button>
 </dialog>
</body>
</html>
