<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mouse Makers | Mouse Practice</title>
<link rel="icon" type="image/svg+xml" href="./favicon.svg">
<meta name="description" content="Mouse skills practice for students. Practice clicking, dragging, scrolling, zooming, and orbiting before Tinkercad.">
<link rel="stylesheet" href="styles.css"><script src="app.js" defer></script>
</head>
<body>
<header class="topbar"><a class="brand" href="./"><span class="brand-icon" aria-hidden="true">↖</span> mouse makers<span class="brand-dot">.</span></a></header>
<main>
<div class="intro"><h1>Mouse practice</h1><p>Six mouse skills. Play each round.</p></div>
<nav id="steps" aria-label="Practice activities"></nav>
<section class="workshop" aria-labelledby="activity-title">
<aside class="instruction"><p class="eyebrow" id="step-label"></p><h2 id="activity-title" tabindex="-1"></h2><p id="instruction"></p><div class="mouse-guide" aria-hidden="true"><kbd id="gesture-key" hidden>Shift</kbd><div class="mouse"><i class="mouse-left"></i><i class="mouse-right"></i><i class="mouse-wheel"></i></div><span id="mouse-caption"></span></div><p class="tip" id="tip"></p><details class="keyboard-help"><summary>Keyboard controls</summary><p id="keyboard-help"></p></details></aside>
<div class="play-column"><div class="stage-top"><span id="stage-label">WORKPLANE PRACTICE</span><span id="counter"></span></div><div class="task-banner" aria-live="polite"><div id="task-visual" role="img" hidden></div><div><span id="task-label">YOUR TASK</span><p id="task"></p></div></div><div id="stage" class="stage"></div><div class="activity-footer"><p id="feedback" role="status" aria-live="polite"></p><button id="next" class="primary" disabled>Next activity <span aria-hidden="true">→</span></button></div></div>
</section>
<div class="below"><span>Finish the rounds to unlock the next skill.</span><button class="text-button" id="retry">↻ Restart round</button></div>
</main>
<footer><a href="../">Made by Jocelyn Remington</a></footer>
</body></html>
