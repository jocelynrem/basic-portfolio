<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f5f7f4" />
  <title>Sound Machine · Classic Widget</title>
  <style>
    :root { font-family: 'Avenir Next', 'Segoe UI', sans-serif; color: #0f172a; background: #ecf3ff; }
    * { box-sizing: border-box; }
    body { margin: 0; background: linear-gradient(180deg, #f8fbff, #ecf3ff); }
    .shell { width: 100%; max-width: 360px; padding: 4px; margin: 0 auto; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding: 4px 8px 8px; }
    h1, h2 { margin: 0; font-size: .88rem; letter-spacing: -.02em; }
    .controls { display: flex; align-items: center; gap: 8px; margin-left: auto; }
    .volume { width: 120px; }
    .volume label { display: flex; justify-content: space-between; margin-bottom: 4px; font-size: .72rem; color: #475569; }
    input[type='range'] { width: 100%; accent-color: #2563eb; }
    button { font: inherit; cursor: pointer; }
    .stop { border: 0; border-radius: 999px; padding: 8px 14px; color: #fff; background: linear-gradient(135deg, #ef4444, #dc2626); font-size: .78rem; font-weight: 700; }
    .panel { padding: 8px; margin-bottom: 4px; background: rgba(255,255,255,.92); border: 1px solid rgba(148,163,184,.22); border-radius: 20px; box-shadow: 0 12px 30px rgba(15,23,42,.08); }
    h2 { margin-bottom: 8px; }
    .sound-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; }
    .sound-btn { display: flex; align-items: center; justify-content: center; aspect-ratio: 1; min-height: 54px; padding: 0; border: 0; border-radius: 12px; transition: transform 160ms, box-shadow 160ms; }
    .sound-btn:hover { transform: translateY(-2px); }
    .sound-btn:active { transform: translateY(0); }
    .sound-btn.active { box-shadow: inset 0 0 0 3px #2563eb; }
    .bell { background: linear-gradient(135deg, #fef3c7, #fde68a); }
    .success { background: linear-gradient(135deg, #d1fae5, #86efac); }
    .buzzer { background: linear-gradient(135deg, #ffe4e6, #fda4af); }
    .attention { background: linear-gradient(135deg, #dbeafe, #93c5fd); }
    .icon { display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; border-radius: 12px; background: rgba(255,255,255,.42); font-size: clamp(2rem, 9vw, 3rem); line-height: .9; }
    button:focus-visible, input:focus-visible { outline: 3px solid #2563eb; outline-offset: 2px; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
    .classroom-link { display: block; margin: 12px 4px; border: 1px solid #dcd7ed; padding: 12px; border-radius: 12px; background: #fff; color: #59428b; text-decoration: none; font-size: .8rem; font-weight: 700; }
    .classroom-link:hover { background: #f3effc; }
    .classroom-link small { display: block; font-size: .68rem; color: #64748b; margin-top: 4px; font-weight: 400; }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <h1>Sound Board</h1>
      <div class="controls">
        <div class="volume"><label for="volume">Volume <output id="volume-value" for="volume">40%</output></label><input id="volume" type="range" min="0" max="100" step="5" value="40" /></div>
        <button id="stop-sound-btn" class="stop" type="button" title="Stop sound (Escape)">Stop</button>
      </div>
    </header>
    <section class="panel" aria-label="Original sound collection">
      <div class="sound-grid" id="sound-library"></div>
    </section>
    <a class="classroom-link" href="classroom.html">Try the classroom experience <span aria-hidden="true">↗</span><small>A full-page board with the updated sound collection</small></a>
    <p class="sr-only" id="playback-status" role="status" aria-live="polite">Ready when you are.</p>
  </main>
  <script src="classic-sounds.js"></script>
  <script src="soundboard.js"></script>
</body>
</html>
